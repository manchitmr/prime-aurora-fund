<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Committee editor — Prime Aurora Welfare Society</title>
<link rel="icon" type="image/png" href="/favicon.png">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  :root {
    color-scheme: light;
    --plane:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink-2:#52514e; --ink-muted:#898781;
    --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10);
    --brand:#2a78d6; --brand-blue:#2a78d6; --good:#0ca30c; --good-text:#006300; --critical:#d03b3b; --warning:#fab219;
    --shadow:0 1px 2px rgba(11,11,11,.04), 0 8px 24px -12px rgba(11,11,11,.12);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --plane:#0d0d0d; --surface:#1a1a19; --ink:#fff; --ink-2:#c3c2b7; --ink-muted:#898781;
      --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
      --brand:#3987e5; --brand-blue:#3987e5; --good-text:#0ca30c;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
    }
  }
  /* An author `display` rule outranks the UA stylesheet's [hidden]{display:none},
     so .btn's inline-flex was keeping "Sign out" on screen while signed out. */
  [hidden] { display: none !important; }
  body { margin:0; background:var(--plane); color:var(--ink);
    font:400 15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; overflow-x:hidden; }
  .wrap { max-width:1180px; margin:0 auto; padding:22px 18px 72px; }

  header.top { display:flex; flex-wrap:wrap; gap:12px; align-items:center;
    justify-content:space-between; margin-bottom:20px; }
  h1 { margin:0; font-size:20px; font-weight:640; letter-spacing:-.02em; }
  .sub { margin:2px 0 0; font-size:13px; color:var(--ink-2); }
  .idbar { display:flex; align-items:center; gap:10px; font-size:13px; color:var(--ink-2); }

  .card { background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:18px 20px; box-shadow:var(--shadow); min-width:0; }
  .card.narrow { max-width:520px; margin:40px auto; }
  .card h2 { margin:0 0 4px; font-size:16px; font-weight:620; }
  h3 { margin:0 0 14px; font-size:16px; font-weight:620; }

  .summary { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    gap:10px; margin-bottom:18px; }
  .stat { background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--brand);
    border-radius:10px; padding:12px 14px; }
  .stat .k { font-size:12px; color:var(--ink-2); }
  .stat .v { font-size:19px; font-weight:640; letter-spacing:-.02em; margin-top:3px; }

  .tabs { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:14px; }
  .tab { border:1px solid transparent; background:none; color:var(--ink-2); font:inherit; font-size:13.5px;
    padding:7px 13px; border-radius:8px; cursor:pointer; }
  .tab:hover { background:color-mix(in oklab, var(--ink) 6%, transparent); color:var(--ink); }
  .tab.active { background:var(--surface); border-color:var(--border); color:var(--ink); font-weight:580; box-shadow:var(--shadow); }

  .secthead { display:flex; flex-wrap:wrap; gap:12px; align-items:flex-start;
    justify-content:space-between; margin-bottom:14px; }
  .secthead p { margin:2px 0 0; font-size:13px; max-width:62ch; }

  .btn { display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:8px;
    border:1px solid var(--border); background:var(--surface); color:var(--ink);
    font:inherit; font-size:13.5px; cursor:pointer; white-space:nowrap; }
  .btn:hover { border-color:var(--axis); }
  .btn.primary { background:var(--brand); border-color:var(--brand); color:#fff; font-weight:560; }
  .btn.primary:hover { filter:brightness(1.07); }
  .btn.danger { background:var(--critical); border-color:var(--critical); color:#fff; }
  .btn.small { padding:5px 10px; font-size:12.5px; }
  .btn:disabled { opacity:.6; cursor:default; }
  .linkbtn { background:none; border:0; padding:0; font:inherit; font-size:13px;
    color:var(--brand); cursor:pointer; text-decoration:underline; text-underline-offset:2px; }
  .linkbtn.danger { color:var(--critical); }

  .tbl-scroll { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; font-size:13.5px; }
  th, td { text-align:left; padding:8px 18px 8px 0; border-bottom:1px solid var(--grid); vertical-align:middle; }
  th { font-size:11.5px; font-weight:620; letter-spacing:.03em; text-transform:uppercase;
    color:var(--ink-muted); border-bottom-color:var(--axis); white-space:nowrap; }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  th:last-child, td:last-child { padding-right:0; }
  .nowrap { white-space:nowrap; }
  .strong { font-weight:620; }
  tbody tr:hover td { background:color-mix(in oklab, var(--brand) 5%, transparent); }

  table.grid th, table.grid td { padding:4px 5px; border-bottom:1px solid var(--grid); }
  .cellinput { width:74px; padding:5px 6px; border:1px solid var(--border); border-radius:6px;
    background:var(--plane); color:var(--ink); font:inherit; font-size:12.5px;
    text-align:right; font-variant-numeric:tabular-nums; }
  .cellinput:focus { outline:2px solid var(--brand); outline-offset:-1px; }
  .cellinput.saved { border-color:var(--good); background:color-mix(in oklab, var(--good) 12%, transparent); }
  .cellinput:disabled { opacity:.5; }

  label { display:block; font-size:12.5px; color:var(--ink-2); }
  input, select { width:100%; margin-top:5px; padding:8px 10px; border:1px solid var(--border);
    border-radius:8px; background:var(--plane); color:var(--ink); font:inherit; font-size:14px; }
  input:focus, select:focus { outline:2px solid var(--brand); outline-offset:-1px; }
  input.setting { max-width:220px; }
  .filter { max-width:260px; margin:0; }
  .toolbar { display:flex; flex-wrap:wrap; gap:14px; align-items:center; margin-bottom:12px; }
  .check { display:flex; align-items:center; gap:7px; font-size:13px; }
  .check input { width:auto; margin:0; }
  .stack { display:grid; gap:14px; margin-top:14px; }

  .grid2 { display:grid; grid-template-columns:1fr; gap:14px; }
  @media (min-width:560px) { .grid2 { grid-template-columns:1fr 1fr; } .grid2 .wide { grid-column:1/-1; } }

  .backdrop { position:fixed; inset:0; background:rgba(0,0,0,.45); display:grid; place-items:center;
    padding:20px; z-index:60; }
  .modal { background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:22px; width:min(560px,100%); max-height:88vh; overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,.3); }
  .actions { display:flex; justify-content:flex-end; gap:8px; margin-top:20px; }

  .pill { display:inline-block; padding:1.5px 8px; border-radius:999px; font-size:11.5px;
    font-weight:560; border:1px solid var(--border); white-space:nowrap; }
  .pill.inc { color:var(--brand-blue); border-color:color-mix(in oklab,var(--brand-blue) 50%,transparent); }
  .pill.don { color:var(--good-text); border-color:color-mix(in oklab,var(--good) 50%,transparent); }
  .pill.exp { color:var(--critical); border-color:color-mix(in oklab,var(--critical) 45%,transparent); }

  .btn.wide { width:100%; justify-content:center; }
  .or { position:relative; text-align:center; font-size:12px; color:var(--ink-muted); }
  .or::before, .or::after { content:""; position:absolute; top:50%; width:calc(50% - 22px);
    border-top:1px solid var(--grid); }
  .or::before { left:0; } .or::after { right:0; }
  .loginmark { justify-content:center; width:100%; margin-bottom:6px; }
  .card.narrow .brand img { max-width:200px; height:auto; }
  header.top .brand { align-items:center; }

  @media print {
    .idbar, .tabs, .btn, .linkbtn, .toolbar, .toast { display:none !important; }
    body { background:#fff; color:#000; }
    .card { box-shadow:none; border-color:#ccc; break-inside:avoid; }
    a[href]::after { content:""; }
  }

  .muted { color:var(--ink-muted); }
  .small { font-size:12.5px; }
  .warn { margin:0 0 14px; padding:9px 12px; border-radius:8px; font-size:12.5px;
    color:var(--ink-2); background:color-mix(in oklab,var(--warning) 16%,transparent);
    border:1px solid color-mix(in oklab,var(--warning) 40%,transparent); }

  .toast { position:fixed; left:50%; bottom:26px; transform:translate(-50%,14px); opacity:0;
    pointer-events:none; transition:.18s ease; background:var(--ink); color:var(--plane);
    padding:10px 18px; border-radius:9px; font-size:13.5px; max-width:90vw; z-index:80; }
  .toast.show { opacity:1; transform:translate(-50%,0); }
  .toast.err { background:var(--critical); color:#fff; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <span id="brand" aria-hidden="true"></span>
      <div>
        <h1>Committee editor</h1>
        <!-- Opened in a new tab so the editor session is never navigated away from. -->
        <p class="sub">Prime Aurora Welfare Society &middot;
          <a href="/" target="_blank" rel="noopener">view the public dashboard&nbsp;↗</a></p>
      </div>
    </div>
    <div class="idbar">
      <span id="exports" hidden>
        <button class="btn small" id="dl-xlsx" title="Full workbook, including household names">↓ Excel</button>
        <button class="btn small" id="dl-pdf" title="Opens your browser's print dialog — choose Save as PDF">↓ PDF</button>
      </span>
      <span id="who"></span>
      <button class="btn small" id="signout" hidden>Sign out</button>
    </div>
  </header>
  <main id="app">
    <div class="card narrow"><p class="muted">Loading…</p></div>
  </main>
</div>
<div class="toast" id="toast"></div>
<script type="module" src="/editor.js"></script>
</body>
</html>
